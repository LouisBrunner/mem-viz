# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  settings:
    govet:
      disable:
        - inline
    revive:
      enable-default-rules: true
      rules:
        - name: var-naming
          disabled: true
        - name: increment-decrement
          disabled: true
        - name: unexported-return
          disabled: true
